<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora AI Report</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
margin:0;
padding:40px;
}

.box{
max-width:900px;
margin:auto;
background:white;
padding:50px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
color:#2563eb;
text-align:center;
}

.subtitle{
text-align:center;
color:#666;
}

.file,.card{
background:#f8fafc;
padding:20px;
margin-top:20px;
border-radius:12px;
border-left:5px solid #2563eb;
}

.file{
background:#e0f2fe;
}

h2{
color:#2563eb;
}

button{
background:#2563eb;
color:white;
border:0;
padding:15px 30px;
border-radius:10px;
cursor:pointer;
margin-top:30px;
}

</style>

</head>


<body>


<div class="box">


<h1>Velora AI Business Report</h1>

<p class="subtitle">
Your business analysis is complete.
</p>


<div class="file">

<strong>File:</strong>

<span id="fileName">
Loading...
</span>

<br><br>

<strong>Size:</strong>

<span id="fileSize">
-
</span>

<br><br>

<strong>Excel Rows:</strong>

<span id="rows">
-
</span>


</div>



<div class="card">

<h2>Executive Summary</h2>

<p id="summary">
-
</p>

</div>



<div class="card">

<h2>Problems</h2>

<ul id="problems"></ul>

</div>



<div class="card">

<h2>Opportunities</h2>

<ul id="opportunities"></ul>

</div>



<button onclick="location.href='upload.html'">
Analyze Another File
</button>


</div>



<script>


const report = JSON.parse(
localStorage.getItem("veloraReport")
);



if(report){


document.getElementById("fileName").textContent =
report.fileName;


document.getElementById("fileSize").textContent =
report.size + " bytes";


if(report.analysis.rows){

document.getElementById("rows").textContent =
report.analysis.rows;

}


document.getElementById("summary").textContent =
report.analysis.summary;



report.analysis.problems.forEach(item=>{

let li=document.createElement("li");

li.textContent=item;

document.getElementById("problems").appendChild(li);

});



report.analysis.opportunities.forEach(item=>{

let li=document.createElement("li");

li.textContent=item;

document.getElementById("opportunities").appendChild(li);

});


}


</script>


</body>

</html>
