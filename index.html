<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora AI Business Analyst</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 40px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 50px;
    text-align: center;
    border-radius: 15px;
}

h1 {
    color: #2563eb;
    font-size: 40px;
}

p {
    color: #555;
    font-size: 18px;
    line-height: 1.6;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 16px 35px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

</style>

</head>


<body>


<div class="container">

<h1>
Velora AI Business Analyst
</h1>


<p>
Upload your business files and let AI discover problems,
opportunities, insights, and the next actions you should take.
</p>


<button onclick="openUpload()">
Upload your files
</button>


</div>


<script>

function openUpload(){

window.location.href = "upload.html";

}

</script>


</body>

</html>
