<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora - Analyzing</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:50px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
width:420px;
}

.loader{
width:70px;
height:70px;
border:6px solid #dbeafe;
border-top:6px solid #2563eb;
border-radius:50%;
margin:0 auto 25px;
animation:spin 1s linear infinite;
}

@keyframes spin{

0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}

}

h1{
color:#2563eb;
margin-bottom:10px;
}

p{
color:#666;
line-height:1.6;
}

</style>

</head>

<body>

<div class="box">

<div class="loader"></div>

<h1>Analyzing Your Business...</h1>

<p>
Velora AI is analyzing your uploaded file.<br>
Please wait a few seconds.
</p>

</div>

<script>

setTimeout(function(){

window.location.href="result.html";

},3000);

</script>

</body>

</html>
