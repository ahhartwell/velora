<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora - Upload Files</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 40px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 15px;
}

h1 {
    color: #2563eb;
}

p {
    color: #555;
}

input {
    margin: 25px;
}

button {

    background: #2563eb;
    color: white;
    border: none;
    padding: 15px 35px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;

}

button:hover {
    opacity: 0.9;
}

</style>

</head>


<body>


<div class="container">


<h1>Upload your files</h1>

<p>
Upload your business files and let Velora analyze your company.
</p>


<input type="file" id="file">


<br>


<button onclick="analyze()">
Analyze
</button>


</div>



<script>

function analyze(){

    let file = document.getElementById("file").files[0];

    if(!file){

        alert("Please upload a file first");

        return;

    }


    window.location.href = "analysis.html";

}


</script>


</body>

</html>
