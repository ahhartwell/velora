<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora Upload</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
margin:0;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:50px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
color:#2563eb;
}

p{
color:#666;
font-size:18px;
}

.upload{
border:2px dashed #2563eb;
padding:40px;
border-radius:15px;
background:#f8fbff;
}

input{
margin-top:20px;
}

#fileName{
margin-top:20px;
color:#2563eb;
font-weight:bold;
}

button{
margin-top:30px;
background:#2563eb;
color:white;
border:0;
padding:15px 35px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

</style>

</head>


<body>


<div class="box">


<h1>
Upload your files
</h1>


<p>
Upload Excel, PDF, or Word files and let Velora analyze your company.
</p>


<div class="upload">


<input 
type="file" 
id="file"
accept=".xlsx,.pdf,.docx"
onchange="showName()">


<div id="fileName">
No file selected
</div>


</div>



<button onclick="analyze()">
Analyze
</button>



</div>



<script src="app.js"></script>


</body>

</html>
