<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Files - Velora</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    text-align: center;
    padding: 80px;
    color: #111827;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
    font-size: 36px;
}

input {
    margin: 30px;
}

button {
    padding: 15px 35px;
    background: #111827;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
}
</style>

</head>

<body>

<div class="box">

<h1>Upload your files</h1>

<p>
Upload your business documents for AI analysis.
</p>

<input type="file">

<br>

<button>
Analyze
</button>

</div>

</body>
</html>
