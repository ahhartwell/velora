<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora Upload</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:40px;
text-align:center;
border-radius:20px;
}

h1{
color:#2563eb;
}

button{
background:#2563eb;
color:white;
border:0;
padding:15px 35px;
border-radius:10px;
cursor:pointer;
}

</style>

</head>


<body>

<div class="box">

<h1>
Upload your files
</h1>

<p>
Upload your business files and let Velora analyze your company.
</p>

<input type="file" id="file">

<br><br>

<button onclick="analyze()">
Analyze
</button>

</div>


<script>

function analyze(){

let file=document.getElementById("file").files[0];

if(!file){

alert("Please upload a file first");

return;

}

location.href="result.html";

}

</script>


</body>

</html>
