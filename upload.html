<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora - Upload Files</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:40px;
}

.box {
    max-width:700px;
    margin:auto;
    background:white;
    padding:50px;
    text-align:center;
    border-radius:20px;
}

h1 {
    color:#2563eb;
}

p {
    color:#555;
    font-size:18px;
}

input {
    margin:25px;
}

button {
    background:#2563eb;
    color:white;
    border:none;
    padding:16px 35px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>


<body>

<div class="box">

<h1>
Upload your files
</h1>

<p>
Upload your business files and let Velora analyze your company.
</p>


<input type="file">


<br>


<button onclick="goResult()">
Analyze
</button>


</div>


<script>

function goResult(){

window.location.href="result.html";

}

</script>


</body>

</html>
